<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="0.5" stop-color="#E24A7B"/>
      <stop offset="1" stop-color="#2AA9E0"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef2"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- outer ring of the fan housing -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8"/>

  <!-- three fan blades (rotational symmetry) -->
  <g fill="#ffffff" filter="url(#sh)">
    <g>
      <path d="M128 128 C 150 96 150 58 120 46 C 104 66 112 104 128 128 Z"/>
    </g>
    <g transform="rotate(120 128 128)">
      <path d="M128 128 C 150 96 150 58 120 46 C 104 66 112 104 128 128 Z"/>
    </g>
    <g transform="rotate(240 128 128)">
      <path d="M128 128 C 150 96 150 58 120 46 C 104 66 112 104 128 128 Z"/>
    </g>
  </g>

  <!-- hub -->
  <circle cx="128" cy="128" r="20" fill="url(#hub)"/>
  <circle cx="128" cy="128" r="7" fill="#9aa7b0"/>
</svg>
